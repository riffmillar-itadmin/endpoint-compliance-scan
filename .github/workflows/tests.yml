# Runs the Pester suite and PSScriptAnalyzer under Windows PowerShell 5.1 AND
# PowerShell 7, then a real scan of the runner under both editions.
#
# The suite needs no network, no secrets and no elevation: every check is fed a
# fixture snapshot. The smoke job is the only one that touches a real machine.
# Its scans only read; its last step registers a scheduled task on the
# throwaway runner and removes it again.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A test job never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels a run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pester:
    name: Pester suite (5.1 and 7)
    # Windows runners ship both powershell.exe 5.1 and pwsh 7.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run Test-ComplianceScan.ps1 -BothEditions
        shell: pwsh
        run: ./Test-ComplianceScan.ps1 -BothEditions

  lint:
    name: PSScriptAnalyzer (${{ matrix.shell }})
    # A separate job, so a lint failure never hides a test result or the reverse.
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false            # let both editions report, even if one fails
      matrix:
        shell: [powershell, pwsh] # Windows PowerShell 5.1 and PowerShell 7
    steps:
      - uses: actions/checkout@v7

      # The step's shell can't come from the matrix, so the matrix picks the
      # executable instead. The same script is what you run locally.
      - name: Lint with PSScriptAnalyzer (fails on errors and warnings)
        shell: cmd
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\Test-ComplianceScanLint.ps1

  smoke:
    name: Live scan of the runner (${{ matrix.shell }})
    # Proves the collectors run on real Windows under each edition, then
    # evaluates that one snapshot against every framework. Exit 0 or 1 (findings
    # on a stock runner are expected) passes; 2 means a collector or check
    # errored, and fails the job. The runner is pinned to Windows Server 2025, a
    # standalone server rather than a domain controller, so it scans with the
    # member server STIG. The other STIG catalogs warn that they were written for
    # another Windows, which is expected here. Then the roll-up reads those
    # reports and must write a page for every framework. Last, the scheduled
    # scan is registered as a real task (the job runs elevated); under
    # powershell it also runs twice, to a share and with the share away.
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7

      - name: Scan the runner
        shell: cmd
        run: |
          ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\Invoke-EndpointComplianceScan.ps1 -Framework DISA-STIG-WS2025-MS -OutputPath "%RUNNER_TEMP%\scan" -SnapshotPath "%RUNNER_TEMP%\runner.snapshot.json"
          if %ERRORLEVEL% GEQ 2 exit /b 1
          exit /b 0

      - name: Evaluate the snapshot against every framework
        shell: cmd
        run: |
          for %%F in (CMMC NIST-800-171r3 NIST-800-53r5 NIST-CSF-2.0 DISA-STIG-Win11 DISA-STIG-WS2019-MS DISA-STIG-WS2019-DC DISA-STIG-WS2022-MS DISA-STIG-WS2022-DC DISA-STIG-WS2025-MS DISA-STIG-WS2025-DC DISA-STIG-Firewall DISA-STIG-AD-Domain DISA-STIG-AD-Forest DISA-STIG-PAW CIS-v8.1 PCI-DSS-4.0.1 HIPAA) do (
            ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\Invoke-EndpointComplianceScan.ps1 -Framework %%F -FromSnapshot "%RUNNER_TEMP%\runner.snapshot.json" -OutputPath "%RUNNER_TEMP%\scan"
            if errorlevel 2 exit /b 1
          )
          exit /b 0

      - name: Roll up the reports
        shell: cmd
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\New-ComplianceRollup.ps1 -Path "%RUNNER_TEMP%\scan"

      - name: Schedule a scan as a task, run it, and remove it
        shell: cmd
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File .\tests\ci\Test-ScheduledScanTask.ps1 -WorkPath "%RUNNER_TEMP%\scheduled" ${{ matrix.shell == 'powershell' && '-Run' || '' }}
